displayName: Gyomu Approval Core

mission: |
  Gyomuプロジェクトにおける承認ワークフローのドメイン基盤を提供する。
  承認リクエスト、ポリシー評価、ライフサイクル管理、監査履歴を
  統一されたドメインモデルとサービス定義として提供することで、
  人による承認と自動承認の双方に対応できる拡張性の高い承認基盤を実現することを目的とする。

policies:
  - 承認ワークフローはドメインモデルを中心に設計する。
  - ライフサイクルの状態遷移は明確に定義し、不正な状態遷移を許可してはならない。
  - 承認結果はポリシー評価とユーザー操作を区別して管理する。
  - サービスはインターフェースのみを定義し、実装は含めない。
  - 監査履歴はイミュータブルに保持し、変更履歴を失ってはならない。
  - 承認操作は型安全なコマンドとして定義する。
  - ドメインモデルはインフラストラクチャ実装へ依存してはならない。

constraints:
  - 永続化処理を実装してはならない。
  - 通知やワークフロー実行を実装してはならない。
  - UIやAPI固有のロジックを実装してはならない。
  - インフラストラクチャ層へ依存してはならない。
  - 承認ポリシーの具体的な実装を含めてはならない。

nonGoals:
  - 承認画面を提供すること。
  - データベースアクセスを提供すること。
  - 通知サービスを実装すること。
  - 承認ルールエンジンを実装すること。
  - ワークフロー実行エンジンを提供すること。

terminology:
  - term: Approval Request
    definition: 承認対象となる操作や変更内容を表すドメインオブジェクト。

  - term: Approval Status
    definition: 承認リクエストの現在のライフサイクル状態。

  - term: Policy Evaluation
    definition: 承認ポリシーに基づいて承認可否を判定した結果。

  - term: Approval History
    definition: 承認リクエストに対して実行されたすべての操作履歴。

  - term: Lifecycle Command
    definition: 承認、却下などライフサイクルを変更する型安全な操作。

rationale:
  - 承認ドメインを独立したパッケージとして定義することで、さまざまなシステムから再利用できる。
  - ドメインモデルとサービス定義を分離することで、インフラストラクチャ実装を自由に差し替えられる。
  - イミュータブルな監査履歴を保持することで、完全なトレーサビリティを確保できる。
  - 型安全なライフサイクルを定義することで、不正な状態遷移を防止できる。
  - 人による承認と自動ポリシー評価を同一のドメインモデルで扱えるようにする。

usage:
  - situation: 新しい承認フローを追加する
    guidance: Approval Requestとライフサイクル定義を利用してワークフローを構築する。

  - situation: 承認操作を実装する
    guidance: 型安全なLifecycle Commandを利用して状態遷移を行う。

  - situation: 承認履歴を取得する
    guidance: History Serviceを利用して監査情報を取得する。

  - situation: 承認ポリシーを追加する
    guidance: Policy Evaluationモデルに従って評価結果を返すよう実装する。

examples:
  - title: 承認リクエスト
    input: |
      AI Toolの実行前に承認を要求したい。
    output: |
      Approval Requestを生成し、承認サービスへ送信する。
    explanation: |
      承認対象は共通のドメインモデルとして管理する。

  - title: 承認操作
    input: |
      ユーザーが承認ボタンを押した。
    output: |
      Approve Commandを実行して状態を更新する。
    explanation: |
      状態変更はライフサイクルコマンドを通して行う。

  - title: ポリシー評価
    input: |
      自動承認ルールを適用したい。
    output: |
      Policy Evaluationを実行し、承認・却下・保留を返す。
    explanation: |
      ポリシー評価とユーザー操作を同じ承認モデルで扱える。

  - title: 監査履歴
    input: |
      過去の承認履歴を表示したい。
    output: |
      History Serviceから履歴を取得する。
    explanation: |
      すべての承認操作を追跡可能な履歴として保持する。
