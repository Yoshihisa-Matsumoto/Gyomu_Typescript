# yaml-language-server: $schema=../../../../schemas/Package.json

displayName: Gyomu Infra

mission: |
  Gyomuエコシステムにおける共通インフラストラクチャ基盤を提供します。
  ファイル操作、データベース、ネットワーク通信、データ変換などの副作用を
  Effectベースのサービスとして抽象化し、型安全で一貫した実行環境を実現します。
  外部ライブラリやプラットフォーム固有の実装を分離することで、
  アプリケーションロジックが安定した共通インターフェースを利用できる基盤を提供します。

policies:
  - 副作用をEffectサービスとして管理し、型安全なエラー処理を行う。
  - 外部ライブラリやプラットフォーム固有処理は抽象化レイヤーへ分離する。
  - インフラ操作はサービスインターフェースを通じて提供する。
  - データ変換はスキーマ検証と組み合わせて境界で整合性を保証する。
  - 大量データ処理ではストリームベースの実装を優先する。
  - エラーは共通モデルとして分類し、診断可能な情報を保持する。
  - データベース操作は型安全なRepositoryパターンを利用する。
  - 共通インフラ機能は特定アプリケーションの業務知識へ依存しない。

constraints:
  - 業務ロジックを実装してはならない。
  - 特定アプリケーションのドメインモデルへ依存してはならない。
  - Node.js標準APIを直接利用することを前提としてはならない。
  - 外部ライブラリのAPIを利用者へ直接公開してはならない。
  - 副作用処理をEffect管理外で実行してはならない。

nonGoals:
  - アプリケーション固有のビジネスロジックを提供すること。
  - UIやユーザーインターフェース機能を提供すること。
  - 特定データベース製品へ直接依存したAPIを提供すること。
  - 外部サービス固有の業務処理を実装すること。
  - プロジェクト固有の設定管理を担当すること。

terminology:
  - term: Infrastructure Service
    definition: 外部システムやプラットフォーム操作を抽象化したEffectサービス。

  - term: Effect Service
    definition: 副作用処理と依存関係を型安全に管理するサービス定義。

  - term: Repository
    definition: データ永続化操作を抽象化するデータアクセス層。

  - term: Serialization
    definition: 構造化データと外部形式間の変換処理。

  - term: Stream Processing
    definition: 大量データを逐次処理するためのストリームベース処理方式。

rationale:
  - インフラ操作を抽象化することでアプリケーションロジックを実装詳細から分離できる。
  - Effectによる副作用管理により、失敗可能な処理を型安全に合成できる。
  - 共通サービス化することでプロジェクト全体で一貫したエラー処理を利用できる。
  - スキーマ検証を境界に配置することで外部データの信頼性を確保できる。
  - 外部ライブラリをラップすることで将来的な実装変更の影響を抑えられる。

usage:
  - situation: ファイル操作を実行したい
    guidance: Node.js標準APIではなく提供されるFileSystemサービスを利用する。

  - situation: データベースへアクセスしたい
    guidance: Repositoryサービスを利用し、型安全なデータアクセスを実装する。

  - situation: 外部データを読み込みたい
    guidance: Serialization機能とSchema検証を組み合わせて処理する。

  - situation: HTTP通信を実行したい
    guidance: Networkサービスを利用して通信処理とエラー管理を統一する。

  - situation: 大量ファイルやアーカイブを処理したい
    guidance: Streamベースのサービスを利用してメモリ効率を維持する。

examples:
  - title: ファイル読み込み
    input: |
      設定ファイルを読み込みたい。
    output: |
      FileSystemサービスを利用してファイル内容を取得する。
    explanation: |
      共通エラー処理とEffectベースの制御により安全にファイル操作を実行できる。

  - title: JSON変換
    input: |
      外部JSONデータをアプリケーションモデルへ変換したい。
    output: |
      Schema定義とSerialization機能を利用して変換する。
    explanation: |
      外部入力を境界で検証し、型安全なデータとして利用できる。

  - title: データベース操作
    input: |
      データを保存・取得したい。
    output: |
      Repositoryサービスを利用してアクセスする。
    explanation: |
      データベース実装を隠蔽し、アプリケーション側は統一されたインターフェースを利用できる。

  - title: HTTP通信
    input: |
      外部APIからデータを取得したい。
    output: |
      Networkサービスを利用してリクエストを実行する。
    explanation: |
      通信エラーやレスポンス処理を共通化し、安定した外部連携を実現できる。
