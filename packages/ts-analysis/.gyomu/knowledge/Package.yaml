# yaml-language-server: $schema=../../../../schemas/Package.json

displayName: Gyomu Typescript Analysis

mission: |
  Gyomuにおけるソースコードドキュメント管理基盤を提供します。
  TypeScriptコードとTSDocコメントの状態を継続的に同期し、
  コード変更に伴うドキュメント更新を安全かつ自動的に管理します。
  ドキュメント生成、変更検出、更新適用を分離することで、
  再現可能で保守性の高いコードドキュメント管理を実現します。

policies:
  - TSDocはソースコードの構造と同期する成果物として管理する。
  - ドキュメント更新は差分検出に基づいて必要な変更のみ適用する。
  - ドキュメント更新計画とソースコードへの適用処理は分離する。
  - コード変更状態は永続化されたSnapshotとして管理する。
  - ファイル操作は正規化されたパスモデルを基準として実行する。
  - 生成されたドキュメント変更は安全に検証可能な形式で扱う。
  - ソースコードとビルド成果物の対応関係を明確に管理する。
  - モノレポ環境でも一貫したドキュメント更新処理を提供する。

constraints:
  - ソースコードを解析せずにTSDoc更新を実行してはならない。
  - 既存コメントを無条件に上書きしてはならない。
  - ドキュメント生成ロジックとファイル更新処理を結合してはならない。
  - 特定のディレクトリ構成やビルド方式へ依存してはならない。

nonGoals:
  - TypeScriptコンパイラ自体の代替となること。
  - AIモデルによるドキュメント内容生成を担当すること。
  - プロジェクト全体のアーキテクチャ分析を担当すること。
  - READMEや設計ドキュメントを生成すること。
  - 特定のコメントフォーマット以外を管理すること。

terminology:
  - term: TSDoc Synchronization
    definition: ソースコードの状態とTSDocコメントを継続的に一致させる仕組み。

  - term: Snapshot
    definition: 特定時点におけるプロジェクト状態を表現する永続化された構造情報。

  - term: Change Detection
    definition: 複数のSnapshotを比較し、コード変更を検出する処理。

  - term: Update Plan
    definition: ドキュメント変更内容を適用前に表現する中間モデル。

  - term: Reconciliation
    definition: 生成されたドキュメント変更と既存ソースコードを統合する処理。

rationale:
  - Snapshotによる状態管理により、ドキュメント更新を決定的かつ差分ベースで実行できる。
  - 更新計画と適用処理を分離することで、安全な変更確認と拡張が可能になる。
  - パス管理を統一することで、モノレポや複雑なビルド環境でも安定した処理を実現できる。
  - ドキュメントをコード変更と同期することで、陳腐化したコメントの発生を防止できる。
  - 自動更新と人間によるレビューを両立できる設計を維持する。

usage:
  - situation: コード変更によるTSDoc更新を検出したい
    guidance: Snapshotを取得し、変更検出処理によって更新対象を特定する。

  - situation: TSDoc変更を安全に適用したい
    guidance: Update Planを生成して内容を確認した後、Reconciliation処理でソースへ反映する。

  - situation: モノレポでファイルを管理したい
    guidance: 提供されるPath Utilityを利用してソースと生成物の対応を解決する。

  - situation: CIでドキュメント同期を実行したい
    guidance: Snapshot比較と更新処理をビルドパイプラインへ組み込む。

examples:
  - title: TSDoc同期
    input: |
      関数シグネチャ変更後にコメントを更新したい。
    output: |
      変更前後のSnapshotを比較し、必要なTSDoc更新を適用する。
    explanation: |
      コード変更とドキュメント変更を同期し、コメントの陳腐化を防止できる。

  - title: 更新計画
    input: |
      自動生成されたコメント変更を確認してから適用したい。
    output: |
      Update Planとして変更内容を保持し、適用処理を分離する。
    explanation: |
      ドキュメント変更を安全にレビュー可能な状態で管理できる。

  - title: パス解決
    input: |
      ビルド後のファイルから元ソースを特定したい。
    output: |
      Path Utilityでsourceとbuild artifactの対応関係を解決する。
    explanation: |
      複雑なプロジェクト構成でも安定したファイル操作を実現できる。
